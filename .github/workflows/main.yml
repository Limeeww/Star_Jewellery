name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint # Check code style
        run: npm run lint

      - name: Run tests # Run unit tests
        run: npm test -- --passWithNoTests

      - name: Build project # Build the application
        run: npm run build

      - name: Start server # Start local server in the background
        run: npm start &
      
      - name: Wait for server # Ensure server is ready before audit
        run: npx wait-on http://localhost:3000
      
      - name: Lighthouse Audit # Run performance and SEO audit
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Deploy to Firebase # Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ github.token }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: your-project-id
        if: github.ref == 'refs/heads/main'
